<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6366f1">
  <meta name="format-detection" content="telephone=no">
  <title>{% block title %}{{ site_name }}{% endblock %}</title>
  <meta name="description" content="{% block description %}影视资源站、采集站、播放源聚合导航与实时可用性监控。{% endblock %}">
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (stored === 'dark' || (!stored && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
<main class="container">
  {% block content %}{% endblock %}

  <footer class="footer">
    <p class="footer-title">{{ site_name }} · 影视资源站与采集接口导航</p>
    <nav class="footer-links" aria-label="页脚导航">
      <a href="/">首页</a>
      <a href="/discover">全部资源站</a>
      <a href="/top">排行榜</a>
      <a href="/monitor">监控</a>
      <a href="/tags">标签</a>
      <a href="/tutorial">采集教程</a>
      <a href="/article">知识库</a>
      <a href="/download">接口配置</a>
      <a href="/api/v1/sources">数据接口</a>
    </nav>
    <p class="footer-copy">© {{ current_year }} {{ site_name }} · 本站为独立部署的资源站导航与监测平台</p>
  </footer>
</main>

<nav class="bottom-nav" aria-label="主导航">
  <a href="/" class="bottom-link {{ 'is-active' if active == 'home' else '' }}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
    <span>首页</span>
  </a>
  <a href="/monitor" class="bottom-link {{ 'is-active' if active == 'monitor' else '' }}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19V6l12-3v13M9 19c0 1.66-1.34 3-3 3s-3-1.34-3-3 1.34-3 3-3 3 1.34 3 3zm12-3c0 1.66-1.34 3-3 3s-3-1.34-3-3 1.34-3 3-3 3 1.34 3 3z"/></svg>
    <span>监控</span>
  </a>
  <a href="/discover" class="bottom-link {{ 'is-active' if active == 'discover' else '' }}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3l2.4 7.4H22l-6 4.6 2.3 7.4-6.3-4.4L5.7 22.4 8 15 2 10.4h7.6z"/></svg>
    <span>发现</span>
  </a>
  <button type="button" class="bottom-link" id="theme-toggle" aria-label="切换明暗主题">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path stroke-linecap="round" d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4l1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/></svg>
    <span>主题</span>
  </button>
</nav>
<script src="/static/app.js"></script>
</body>
</html>
